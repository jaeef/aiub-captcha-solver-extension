<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captcha Auto-Solver</title>
    <style>
      body {
        font: 13px system-ui, sans-serif;
        width: 250px;
        margin: 0;
        padding: 14px;
        background: #1e1f24;
        color: #e8e8ea;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #555;
        transition: 0.2s;
      }
      #dot.on { background: #3ddc72; }
      .tagline { color: #6b6c74; font-size: 11px; margin-bottom: 10px; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #2a2b31;
        padding: 8px 10px;
        border-radius: 8px;
        margin: 6px 0;
      }
      .switch { position: relative; width: 40px; height: 22px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider { position: absolute; inset: 0; background: #45464d; border-radius: 22px; cursor: pointer; transition: 0.2s; }
      .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
      input:checked + .slider { background: #3ddc72; }
      input:checked + .slider::before { transform: translateX(18px); }
      #status {
        margin-top: 10px;
        padding: 8px;
        border-radius: 6px;
        background: #2a2b31;
        color: #9a9ba3;
        min-height: 18px;
      }
      #status.ok { background: #163d24; color: #3ddc72; }
      #status.bad { background: #3d1616; color: #ff5c5c; }
      .hint { color: #6b6c74; font-size: 11px; margin-top: 8px; line-height: 1.5; }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #2a2b31;
        font-size: 11px;
      }
      .footer a {
        position: relative;
        z-index: 0;
        color: #3ddc72;
        text-decoration: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 6px;
        margin: -3px -6px;
        border-radius: 4px;
        -webkit-font-smoothing: antialiased;
        transition: color 200ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .footer a::before,
      .footer a::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 4px;
        z-index: -1;
        pointer-events: none;
        box-sizing: border-box;
      }
      .gh-link {
        will-change: transform;
      }
      .gh-link::before {
        background: #3ddc72;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .gh-link::after {
        inset: -1px;
        border-radius: 5px;
        border: 1px solid rgba(163, 247, 191, 0.75);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .gh-link:hover {
        color: #121316;
        transform: translate(-1px, -1px);
        transition: color 100ms cubic-bezier(0.2, 0.8, 0.2, 1) 120ms, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .gh-link:hover::before,
      .gh-link:hover::after {
        transform: scaleX(1);
      }
      #feedbackLink::before {
        background: #e55353;
        opacity: 0;
        transform: none;
        transition: opacity 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #feedbackLink::after {
        inset: -1px;
        border-radius: 5px;
        border: 1px solid rgba(255, 175, 175, 0.75);
        opacity: 0;
        transform: none;
        transition: opacity 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #feedbackLink:hover {
        color: #121316;
        transform: none;
        transition: color 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #feedbackLink:hover::before,
      #feedbackLink:hover::after {
        opacity: 1;
        transform: none;
      }
      .gh-link svg { display: block; }
    </style>
  </head>
  <body>
    <h1><span id="dot"></span>Captcha Auto-Solver</h1>
    <div class="tagline">Automatic on-device captcha solver</div>

    <div class="row">
      <span>Auto-solve captcha</span>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <span>Auto-click login button</span>
      <label class="switch">
        <input id="autoSubmit" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <div id="status">No captcha detected yet. Ready.</div>
    <div class="hint" id="hint">Automatically recognizes and fills the math captcha on the login portal.</div>

    <div class="footer">
      <a href="https://github.com/jaeef" target="_blank" rel="noopener" class="gh-link">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
      </a>
      <a href="#" id="feedbackLink">Feedback / Report bug</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
